<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" aria-label="SENTRON Shield Brand Mark">
  <defs>
    <linearGradient id="sentronGoldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F7D878"/>
      <stop offset="50%" stop-color="#E2B83B"/>
      <stop offset="100%" stop-color="#B88A1A"/>
    </linearGradient>
    <linearGradient id="sentronDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22252C"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <filter id="sentronGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Circular Ring -->
  <circle cx="64" cy="64" r="58" fill="url(#sentronDarkGrad)" stroke="url(#sentronGoldGrad)" stroke-width="3.5"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(226, 184, 59, 0.2)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Outer Shield Silhouette -->
  <path d="M64 26 
           L92 31.5 
           L92 64 
           C92 81 74 95 64 102 
           C54 95 36 81 36 64 
           L36 31.5 Z" 
        fill="url(#sentronGoldGrad)" 
        stroke="#F7D878" 
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Inner Dark Shield Core -->
  <path d="M64 36 
           L81 39.5 
           L81 63 
           C81 74 69.5 84 64 89 
           C58.5 84 47 74 47 63 
           L47 39.5 Z" 
        fill="#121316" 
        stroke="rgba(226, 184, 59, 0.4)" 
        stroke-width="1"
        stroke-linejoin="round"/>

  <!-- Center Sentinel Emblem / Stylized S Core -->
  <path d="M64 45 L72 49 L72 58 L64 62 L56 58 L56 49 Z" 
        fill="url(#sentronGoldGrad)" 
        opacity="0.95"/>
  <path d="M64 65 L70 69 L64 81 L58 69 Z" 
        fill="url(#sentronGoldGrad)" 
        opacity="0.75"/>
</svg>
