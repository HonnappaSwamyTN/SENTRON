[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentron"
version = "0.1.0"
description = "Windows-first local agent-action protection and system health monitoring"
requires-python = ">=3.11"
dependencies = ["PySide6", "psutil"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
