[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentron"
version = "0.1.0"
description = "Local-first Windows AI-agent action protection and system health monitoring suite"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SENTRON Core Team" }
]
dependencies = [
    "PySide6>=6.5.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Fast isolated unit tests without OS side-effects",
    "integration: Cross-module and database integration tests",
    "windows_only: Tests requiring native Windows APIs or Windows Event Logs",
    "offline: Tests verifying zero network calls and complete offline functionality"
]
addopts = "-ra --strict-markers"
